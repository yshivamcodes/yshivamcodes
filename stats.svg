<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#6D28D9"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
  <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    @keyframes ring{from{stroke-dashoffset:430}to{stroke-dashoffset:92}}
    @keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
    .r{animation:ring 2s ease-out forwards}
    .row{opacity:0;animation:in .6s ease forwards;animation-delay:var(--d)}
  </style>
</defs>
<rect x="4" y="4" width="512" height="252" rx="24" fill="#050505" stroke="#6D28D9" stroke-opacity=".55"/>
<text x="28" y="34" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="11" font-weight="800" letter-spacing="2">LOCAL GITHUB STATS</text>
<circle cx="120" cy="137" r="68" fill="#0F0F1A" stroke="#22183B" stroke-width="12"/>
<circle cx="120" cy="137" r="68" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="430" stroke-dashoffset="430" class="r" transform="rotate(-90 120 137)" filter="url(#gl)"/>
<text x="120" y="132" text-anchor="middle" fill="#EDE9FE" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="900">RISING</text>
<text x="120" y="151" text-anchor="middle" fill="#60A5FA" font-family="ui-monospace,monospace" font-size="10" font-weight="800">BUILDER</text>
<g font-family="ui-sans-serif,system-ui">
  <g class="row" style="--d:.35s"><text x="215" y="88" fill="#94A3B8" font-size="11">FOCUS</text><text x="485" y="88" text-anchor="end" fill="#EDE9FE" font-size="13" font-weight="800">DATA + AI</text><path d="M215 98H485" stroke="#22183B"/></g>
  <g class="row" style="--d:.55s"><text x="215" y="130" fill="#94A3B8" font-size="11">STACK</text><text x="485" y="130" text-anchor="end" fill="#EDE9FE" font-size="13" font-weight="800">PYTHON • C++ • JAVA</text><path d="M215 140H485" stroke="#22183B"/></g>
  <g class="row" style="--d:.75s"><text x="215" y="172" fill="#94A3B8" font-size="11">MODE</text><text x="485" y="172" text-anchor="end" fill="#EDE9FE" font-size="13" font-weight="800">LEARN → BUILD → SHIP</text><path d="M215 182H485" stroke="#22183B"/></g>
  <g class="row" style="--d:.95s"><text x="215" y="214" fill="#94A3B8" font-size="11">GOAL</text><text x="485" y="214" text-anchor="end" fill="#EDE9FE" font-size="13" font-weight="800">INTELLIGENT SYSTEMS</text></g>
</g>
</svg>